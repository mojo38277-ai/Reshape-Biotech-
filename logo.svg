<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d2147"/>
      <stop offset="100%" stop-color="#0f1026"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle (petri dish) -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="rgba(56,189,248,0.25)" stroke-width="3"/>

  <!-- Inner ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(56,189,248,0.15)" stroke-width="2"/>

  <!-- DNA helix strands (background element) -->
  <path d="M 130 256 Q 190 180 256 256 Q 322 332 382 256" fill="none" stroke="rgba(56,189,248,0.12)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 382 256 Q 322 180 256 256 Q 190 332 130 256" fill="none" stroke="rgba(56,189,248,0.10)" stroke-width="4" stroke-linecap="round"/>

  <!-- Stylized rod-shaped bacterium (center) -->
  <g transform="translate(256, 256)">
    <!-- Cell body -->
    <path d="M -46 0 Q -46 -56 0 -56 Q 46 -56 46 0 Q 46 56 0 56 Q -46 56 -46 0 Z" fill="#38bdf8"/>
    <!-- Cell wall detail -->
    <path d="M -40 -28 Q -40 28 0 28 Q 40 28 40 -28 Q 40 -28 0 -28" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
    <!-- Nucleoid region -->
    <ellipse cx="-14" cy="-6" rx="14" ry="20" fill="rgba(14,165,233,0.35)"/>
    <!-- Flagella (left) -->
    <path d="M -46 -10 Q -70 -20 -95 0 Q -70 20 -46 10" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <!-- Flagella (right) -->
    <path d="M 46 -12 Q 70 -22 95 0 Q 70 22 46 12" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>

    <!-- Pili / surface detail -->
    <g stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round">
      <line x1="-30" y1="-30" x2="-20" y2="-38"/>
      <line x1="30" y1="-30" x2="20" y2="-38"/>
      <line x1="-28" y1="28" x2="-18" y2="36"/>
      <line x1="28" y1="28" x2="18" y2="36"/>
    </g>
  </g>

  <!-- Glow behind bacterium -->
  <circle cx="256" cy="256" r="120" fill="rgba(56,189,248,0.10)" filter="url(#glow)"/>

  <!-- Biotech marker dots -->
  <circle cx="110" cy="110" r="5" fill="#38bdf8"/>
  <circle cx="402" cy="402" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="100" cy="410" r="3" fill="#38bdf8" opacity="0.4"/>
  <circle cx="410" cy="100" r="3" fill="#38bdf8" opacity="0.4"/>
</svg>
